services:
  db:
    image: postgres:18.4-trixie
    restart: always
    volumes:
      - ./postgres_debug:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    profiles:
      - dev
    image: adminer:5.4.2-standalone
    restart: always
    ports:
      - "8080:8080"

  redis:
    image: redis:8.8.0-trixie
    restart: always
    volumes:
      - ./redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  migration:
    image: reader_bot:latest
    profiles:
      - bot
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: ["alembic", "upgrade", "head"]

  app:
    profiles:
      - bot
    image: reader_bot:latest
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8000:8000"

  npm:
    profiles:
      - dev
    image: 'jc21/nginx-proxy-manager:2.15.1'
    restart: unless-stopped
    environment:
      TZ: "Asia/Yekaterinburg"
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt