services:
  db:
    image: postgres
    restart: always
    volumes:
      - ./postgres_debug:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
