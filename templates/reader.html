<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ request.app.url_path_for("css", path="main.css") }}?v={{ ver }}">
    <link rel="stylesheet" href="{{ request.app.url_path_for("css", path="status-bar.css") }}?v={{ ver }}">
    <link rel="stylesheet" href="{{ request.app.url_path_for("css", path="pdf-frame.css") }}?v={{ ver }}">
    <link rel="preload" as="style" href="{{ request.app.url_path_for("css", path="toolbar.css") }}?v={{ ver }}">
    <script src="{{ request.app.url_path_for("js", path="webapp-worker.js") }}?v={{ ver }}"
            id="webapp-worker"
            data-reader-mode="{{ reader_mode }}"
    ></script>
</head>

<body>
    <div id="statusBar">
        <div class="icon">
            <div id="spinner" class="spinner"></div>
            <div id="check" class="check">✔</div>
        </div>
        <span id="statusText">Подготовка документа...</span>
    </div>
    <iframe id="pdfFrame"
            data-session_id="{{ session_id }}"
            data-page="{{ page }}"
            data-assets-version="{{ ver }}"
    >
    </iframe>

    <script src="{{ request.app.url_path_for("js", path="pdf-viewer.js") }}?v={{ ver }}"></script>
    {%if level_debug in ['INFO', 'DEBUG'] -%}
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    {%endif-%}
</body>
</html>
